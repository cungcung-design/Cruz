name: GitHub Snake Game

on:
  # Run every day at 3:30 AM UTC to avoid GitHub API peak load
  schedule:
    - cron: "30 3 * * *"

  # Allow manual execution from the Actions tab
  workflow_dispatch:

# Grant necessary permissions to write generated files back to the repository
permissions:
  contents: write

jobs:
  generate:
    name: Generate Contribution Snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Generate the GitHub contribution snake SVGs & Animations
      - name: Generate GitHub Contributions Snake Animations
        id: generate
        uses: Platane/snk@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Publish generated assets to the 'output' branch seamlessly
      - name: Deploy to Output Branch
        if: steps.generate.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update automatic github-snake animation [skip ci]"
